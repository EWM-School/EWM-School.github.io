name: Build & Publish Android APK + AAB

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'android-apk-aab-release'
  cancel-in-progress: true

jobs:
  build-android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]') &&
        github.actor != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Auto-increment semantic version (v1.2.x) & Android versionCode
        run: node scripts/ci-bump-version.mjs

      - name: Build production web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Prepare Release Keystore & Verify SHA-1 / SHA-256 Fingerprints
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/ewm-release.p12"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > "$KEYSTORE_FILE"
            DETECTED_ALIAS=$(keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | awk '/^Alias name:/ {sub(/^Alias name:[[:space:]]*/, ""); a=$0} /PrivateKeyEntry/ {print a; exit}')
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "Using persistent Organization release keystore."
              keytool -J-Duser.language=en -list -v -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true
              echo "EWM_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
              echo "EWM_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
              echo "EWM_KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
              echo "EWM_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "Generating fallback PKCS12 distribution keystore via keytool..."
          rm -f "$KEYSTORE_FILE"
          FALLBACK_PASS="EwmSchoolKeepPracticing2026Key!"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -alias ewm-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$FALLBACK_PASS" \
            -keypass "$FALLBACK_PASS" \
            -dname "CN=EWM Keep Practicing, OU=Mobile, O=EWM School, L=Sao Paulo, ST=SP, C=BR"
          echo "EWM_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "EWM_KEYSTORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          echo "EWM_KEY_ALIAS=ewm-release" >> "$GITHUB_ENV"
          echo "EWM_KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"

      - name: Compile Signed Release APK & Play Store App Bundle (.AAB)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Stage Signed EWM-Keep-Practicing.apk & EWM-Keep-Practicing.aab
        run: |
          APK_SOURCE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SOURCE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          if [ -z "$AAB_SOURCE" ]; then
            echo "Error: Release AAB not found!"
            exit 1
          fi
          cp "$APK_SOURCE" "$RUNNER_TEMP/EWM-Keep-Practicing.apk"
          cp "$AAB_SOURCE" "$RUNNER_TEMP/EWM-Keep-Practicing.aab"
          cp "$APK_SOURCE" ./EWM-Keep-Practicing.apk
          cp "$AAB_SOURCE" ./EWM-Keep-Practicing.aab
          jarsigner -verify ./EWM-Keep-Practicing.aab
          ls -lh ./EWM-Keep-Practicing.apk ./EWM-Keep-Practicing.aab

      - name: Upload APK & AAB Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: EWM-Keep-Practicing-Android-Release
          path: |
            ./EWM-Keep-Practicing.apk
            ./EWM-Keep-Practicing.aab
          retention-days: 30

      - name: Publish Official Latest GitHub Release (APK + AAB)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          TAG="v${APP_VER}"
          TITLE="EWM · Keep practicing — Release Oficial Mobile ($TAG)"
          NOTES=$(cat <<EOF
          ### 📱 EWM · Keep practicing — Aplicativo Oficial ($TAG · Build #${NEXT_VERSION_CODE})

          Pacotes oficiais assinados compilados automaticamente em **https://ewm-school.github.io/**:
          - **\`EWM-Keep-Practicing.apk\`** — Instalador direto para smartphones Android (com App Links verificados, ícone oficial EWM, Splash Screen nativa, vozes US/UK nativas, vibração tátil e modo 100% Offline-First).
          - **\`EWM-Keep-Practicing.aab\`** — Pacote *Android App Bundle* assinado pronto para publicação no **Google Play Console**.
          - **Política de Privacidade Oficial (LGPD):** https://ewm-school.github.io/privacy.html
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/EWM-Keep-Practicing.apk" "$RUNNER_TEMP/EWM-Keep-Practicing.aab" --clobber
            gh release edit "$TAG" --latest --draft=false --prerelease=false --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$RUNNER_TEMP/EWM-Keep-Practicing.apk" "$RUNNER_TEMP/EWM-Keep-Practicing.aab" --latest --title "$TITLE" --notes "$NOTES"
          fi

      - name: Commit bumped semantic version back to main with [skip ci]
        run: |
          cp package.json "$RUNNER_TEMP/package.json.bumped"
          cp android/app/build.gradle "$RUNNER_TEMP/build.gradle.bumped"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          cp "$RUNNER_TEMP/package.json.bumped" package.json
          cp "$RUNNER_TEMP/build.gradle.bumped" android/app/build.gradle
          if ! git diff --quiet package.json android/app/build.gradle; then
            git add package.json android/app/build.gradle
            git commit -m "chore(release): bump version to v${NEXT_VERSION} (code ${NEXT_VERSION_CODE}) [skip ci]"
            git push origin HEAD:main
          fi
