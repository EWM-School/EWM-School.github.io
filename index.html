    <script>
      (function() {
        // Intercept Vite dev HMR WebSocket in Cloud Run iframe preview environment
        // Completely prevents '[vite] failed to connect to websocket' and 'WebSocket closed without opened'
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var isVite = (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
                         (Array.isArray(protocols) && protocols.some(function(p) { return String(p).indexOf('vite') !== -1; })) ||
                         (String(url).indexOf('vite-hmr') !== -1) ||
                         (String(url).indexOf(':24678') !== -1);
            if (isVite) {
              var listeners = {};
              var ws = {
                readyState: 1, // WebSocket.OPEN to satisfy Vite's isOpened check
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                url: String(url),
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open' }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return ws;
            }
            return new NativeWebSocket(url, protocols);
          }
          MockViteWebSocket.prototype = NativeWebSocket.prototype;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSED = 3;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CONNECTING = 0;
          window.WebSocket = MockViteWebSocket;
        }

        // Cleanly filter console.error, console.warn and uncaught events for benign dev/proxy noise
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a && a.message || a || ''); }).join(' ');
          if (
            joined.indexOf('WebSocket') !== -1 ||
            joined.indexOf('[vite]') !== -1 ||
            joined.indexOf('websocket') !== -1 ||
            joined.indexOf('WebChannelConnection') !== -1 ||
            joined.indexOf("RPC 'Listen' stream") !== -1
          ) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) { return String(a && a.message || a || ''); }).join(' ');
          if (
            joined.indexOf('WebSocket') !== -1 ||
            joined.indexOf('[vite]') !== -1 ||
            joined.indexOf('websocket') !== -1 ||
            joined.indexOf('WebChannelConnection') !== -1 ||
            joined.indexOf("RPC 'Listen' stream") !== -1
          ) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var msg = String((event.reason && (event.reason.message || event.reason)) || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('WebChannelConnection') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = String(event.message || event.filename || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('WebChannelConnection') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

  <body>
    <div id="root"></div>

  </body>
